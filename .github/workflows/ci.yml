name: CI

# Push-triggered so the workflow (with the compact ESLint formatter) runs from
# THIS branch — including when CyclOps's autofix loop pushes a fix back to it.
on:
  push:
    branches: [demo-lint-loop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx eslint src --format ./eslint-compact.cjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
